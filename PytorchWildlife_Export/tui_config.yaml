headings:
  model_type: "Select Model Type"
  model_version: "Select Model Version"
  output_dir: "Output Directory"
  format: "Select Export Format (Precision)"
  input_img_size: "Input Image Size"
  opset: "ONNX Opset Version"
  simplify: "Simplify ONNX Model"
  allow_denormalized: "Allow Denormalized Input (0-255)"
  allow_nhwc: "Allow NHWC Input Layout"
  allow_uint8: "Allow uint8 Input"
  run_export: "Run Export"

instructions:
  model_type: "Choose the type of model you want to export."
  model_version: "Choose the specific version of the selected model."
  output_dir: "Enter the directory where the exported model will be saved."
  format: |
    Select the precision for the exported model.
    'int8' is not well supported currently.
  input_img_size: "Enter the input image size for the model (e.g., 640)."
  opset: "Enter the ONNX opset version to use for the export."
  simplify: "Enable this to simplify the exported ONNX model using onnx-simplifier."
  allow_denormalized: |
    If enabled, the model will accept pixel values in the range **0–255** (float)
    instead of the default **0.0–1.0**. A `/255` normalization layer is inserted
    at the start of the model.
  allow_nhwc: |
    If enabled, the model will accept tensors in **NHWC** layout (batch, height,
    width, channels) instead of the default **NCHW** layout. A transpose op is
    inserted at the start of the model. The exported input shape changes accordingly.
  allow_uint8: |
    If enabled, the model's input tensor dtype is changed to **uint8**. A cast to
    float32 is inserted at the start of the model. Combine with *Allow Denormalized*
    to accept raw 0-255 uint8 pixel data.
  run_export: "Review the selected options below and proceed to run the export."

options:
  model_type:
    - value: 'yolov9'
      label: 'YOLOv9'
    - value: 'yolov10'
      label: 'YOLOv10'
    - value: 'yolov10_v9_compatible'
      label: 'YOLOv10 (v9 compatible output)'
  model_version:
    yolov9:
      - value: 'MDV6-yolov9-c'
        label: 'MegaDetectorV6-Ultralytics-YoloV9-Compact'
      - value: 'MDV6-yolov9-e'
        label: 'MegaDetectorV6-Ultralytics-YoloV9-Extra'
    yolov10:
      - value: 'MDV6-yolov10-c'
        label: 'MegaDetectorV6-Ultralytics-YoloV10-Compact'
      - value: 'MDV6-yolov10-e'
        label: 'MegaDetectorV6-Ultralytics-YoloV10-Extra'
    yolov10_v9_compatible:
      - value: 'MDV6-yolov10-c'
        label: 'MegaDetectorV6-Ultralytics-YoloV10-Compact'
      - value: 'MDV6-yolov10-e'
        label: 'MegaDetectorV6-Ultralytics-YoloV10-Extra'
  format:
    - value: 'float32'
      label: 'FP32 (float32)'
    - value: 'float16'
      label: 'FP16 (float16)'
    - value: 'int8'
      label: 'INT8 (quantized)'
  simplify:
    - value: True
      label: 'Yes'
    - value: False
      label: 'No'
  allow_denormalized:
    - value: False
      label: 'No  — model expects 0.0–1.0 float input (default)'
    - value: True
      label: 'Yes — model accepts 0–255 float input'
  allow_nhwc:
    - value: False
      label: 'No  — model expects NCHW layout (default)'
    - value: True
      label: 'Yes — model accepts NHWC layout'
  allow_uint8:
    - value: False
      label: 'No  — model expects float32 input (default)'
    - value: True
      label: 'Yes — model accepts uint8 input'

defaults:
  model_type: 'yolov10_v9_compatible'
  model_version: 'MDV6-yolov10-c'
  output_dir: 'exported_models'
  format: 'float16'
  input_img_size: 320
  opset: 18
  simplify: True
  allow_denormalized: False
  allow_nhwc: False
  allow_uint8: False

ranges:
  input_img_size:
    min: 128
    max: 1280
  opset:
    min: 12
    max: 22
